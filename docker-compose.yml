# Production stack: Amber Backup + PostgreSQL, using the pre-built image.
# Configure secrets in a .env file next to this file (see .env.example), then:
#   docker compose up -d
# The app applies pending DB migrations automatically on startup.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amber
      # Required — do not ship a default DB password. Generate with: openssl rand -base64 24
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: amber
    volumes:
      - amber-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amber"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: devpatf/amber-backup:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Swagger UI at /api/explorer is off in production (unauthenticated).
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      PORT: 3000
      DATABASE_URL: postgres://amber:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/amber
      # Required — generate with: openssl rand -base64 32  (must decode to 32 bytes)
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?set MASTER_ENCRYPTION_KEY in .env}
      # Required — generate with: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # Behind a reverse proxy (Traefik, nginx, Caddy, …) set this to the number
      # of proxy hops (usually 1), or the audit log, rate limiter and admin IP
      # allowlist see the proxy's container address instead of the client's.
      TRUST_PROXY: ${TRUST_PROXY:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      # Required — never ship a default admin password on an internet-reachable app.
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - amber-data:/data
      # Mount host directories you want to back up as local sources, read-only:
      # - /srv/important-data:/backup/important-data:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  amber-pgdata:
  amber-data:
